[package]
name = "xumuge-ai"
version = "1.0.2"
description = "Virmoor (???) - desktop agent workspace"
authors = ["jiuka"]
license = "Apache-2.0"
repository = "https://gitee.com/yjk100_admin/ai-smart-warehouse"
edition = "2021"

[lib]
name = "xumuge_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
portable-pty = "0.9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
hex = "0.4"
urlencoding = "2"
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-screenshots = "2.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking", "multipart"] }
futures-util = "0.3"
diffy = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.3"
docx-rs = "0.4"
rust_xlsxwriter = "0.79"
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
ignore = "0.4"
pdf-extract = "0.12.0"
once_cell = "1"
# Offline ASR (sherpa) + Kokoro TTS (vendored tts-rs / ort)
sherpa-onnx = { version = "1.13.6", optional = true }
tts-rs = { path = "vendor/tts-rs", optional = true, features = ["kokoro"] }
hound = { version = "3.5", optional = true }

[features]
# tauri CLI uses --no-default-features; enable via tauri.conf.json build.features
default = []
native-tts = ["dep:tts-rs", "dep:hound"]
native-voice = ["native-tts", "dep:sherpa-onnx"]
# Dev only: pnpm tauri:dev. Do not enable on release (no WebView DevTools surface).
devtools = ["tauri/devtools"]

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
winreg = "0.55"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
debug = false
strip = true
# Verified 2026-09-01 (rustc 1.97): lto=thin still fails schemars 0.8 + indexmap 1.9 (E0107).
# keyboard-types bitflags/serde is fixed via vendor patch; keep patch for when thin is viable.
lto = false
codegen-units = 16
panic = "abort"

[patch.crates-io]
keyboard-types = { path = "vendor/keyboard-types" }
