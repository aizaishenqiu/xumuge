# Vendored from crates.io tts-rs 2026.2.3, patched for ort 2.0.0-rc.13
# (upstream pins rc.10 but uses APIs that only match newer ort + ndarray 0.17).

[package]
edition = "2021"
name = "tts-rs"
version = "2026.2.3-fou.1"
description = "Kokoro TTS (vendored/patched for Virmoor)"
license = "MIT"
repository = "https://github.com/rishiskhare/tts-rs"

[features]
default = []
kokoro = ["dep:ort", "dep:ndarray", "dep:zip", "dep:pinyin"]

[lib]
name = "tts_rs"
path = "src/lib.rs"

[dependencies]
derive_builder = "0.20.2"
env_logger = "0.10.0"
hound = "3.5.1"
log = "0.4.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.16"
ndarray = { version = "0.17", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
pinyin = { version = "0.11.0", optional = true, features = ["with_tone_num_end"] }
